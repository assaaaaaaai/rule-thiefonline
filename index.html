<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8e7bb">
<title>もぐもぐパニック！｜ゲームクラフトラボ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#365a42;background:#b8e7bb;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{min-height:100svh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:radial-gradient(circle at 18% 13%,#eaffdd 0 11%,transparent 12%),radial-gradient(circle at 86% 20%,#eaffdd 0 8%,transparent 9%),linear-gradient(165deg,#d8f6d0,#a9dbb2)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ff8a80;outline-offset:3px}.game{position:relative;isolation:isolate;width:min(100%,440px);padding:16px 16px 18px;border:4px solid #fff9e8;border-radius:28px;background:#fff8e8;box-shadow:0 14px 0 #85bb8c,0 22px 38px #386a4940;overflow:hidden}.brand{text-align:center;font-size:11px;font-weight:800;letter-spacing:.09em;color:#7da785}.heading{margin:2px 0 10px;text-align:center;font-size:clamp(23px,7vw,32px);letter-spacing:.04em;color:#e87979;text-shadow:2px 3px 0 #ffe3ad}.heading span{color:#6ab77f}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:12px}.stat{background:#fff;border:2px solid #f1e5c7;border-radius:15px;padding:7px 4px;text-align:center}.stat small{display:block;font-size:10px;font-weight:900;color:#93a18c}.stat strong{font-size:23px;font-variant-numeric:tabular-nums;color:#4b966c}.stat.timer strong{color:#e58b63}.stat.best strong{color:#d99b39}.field{padding:14px 12px 12px;border-radius:22px;background:linear-gradient(#a9d888,#82bf7c);border:3px solid #76b76f;box-shadow:inset 0 5px 0 #d2ec9c}.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}.hole{position:relative;aspect-ratio:1.18;border:0;background:transparent;padding:0;touch-action:manipulation;overflow:hidden}.pit{position:absolute;bottom:4%;left:4%;width:92%;height:47%;border-radius:50%;background:#644533;box-shadow:inset 0 7px 0 #4a3428,0 5px 0 #74aa63}.mole{position:absolute;left:15%;bottom:10%;width:70%;height:82%;transform:translateY(110%);transition:transform 180ms cubic-bezier(.18,1.3,.3,1);pointer-events:none}.hole.up .mole{transform:translateY(0)}.body{position:absolute;inset:8% 0 0;background:#b77c56;border:3px solid #986243;border-radius:49% 49% 42% 42%;box-shadow:inset -7px -5px 0 #a36a4b}.ear{position:absolute;top:3%;width:25%;height:28%;background:#b77c56;border:3px solid #986243;border-radius:50%}.ear.left{left:5%}.ear.right{right:5%}.face{position:absolute;inset:24% 13% 12%;background:#e7b999;border-radius:50%}.eye{position:absolute;top:34%;width:9%;height:12%;background:#392d2a;border-radius:50%}.eye.left{left:27%}.eye.right{right:27%}.nose{position:absolute;top:52%;left:44%;width:12%;height:9%;background:#e88691;border-radius:50%}.blush{position:absolute;top:56%;width:18%;height:10%;background:#f6a6a6;border-radius:50%;opacity:.8}.blush.left{left:10%}.blush.right{right:10%}.lip{position:absolute;top:63%;left:43%;width:14%;height:8%;border-bottom:2px solid #8c534d;border-radius:50%}.front{position:absolute;bottom:0;left:0;width:100%;height:19%;border-radius:50%;background:#91c975;pointer-events:none}.hole.hit .mole{filter:brightness(1.2);transform:translateY(35%) scale(.92)}.hole.up:not(.hit) .mole{animation:mole-wiggle .45s ease-in-out infinite alternate}@keyframes mole-wiggle{from{rotate:-4deg}to{rotate:4deg}}.hole:active .pit{filter:brightness(1.12)}.pop{position:absolute;top:3%;left:25%;font-size:18px;font-weight:1000;color:#fff;text-shadow:1px 2px #ec856b;animation:float .6s ease-out forwards;pointer-events:none}@keyframes float{to{opacity:0;transform:translateY(-30px)}}.progress{height:10px;border-radius:20px;background:#e9e8d1;margin:12px 0 10px;overflow:hidden}.progress>div{height:100%;width:100%;background:linear-gradient(90deg,#f3b35f,#f27d80);transition:width .15s linear}.controls{display:flex;gap:8px}.primary{flex:1;min-height:49px;border:0;border-radius:15px;background:#f28b86;color:white;font-weight:1000;font-size:17px;box-shadow:0 5px 0 #d56b6b}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #d56b6b}.sound{min-width:53px;border:2px solid #d6e6c7;border-radius:15px;background:#fff;color:#538b69;font-size:21px}.hint{text-align:center;font-size:12px;font-weight:700;color:#85a08a;margin:12px 0 0;min-height:18px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#fff8e8e8;backdrop-filter:blur(5px);padding:24px;text-align:center}.overlay[hidden]{display:none}.modal{width:100%;padding:23px 16px;border:3px solid #f4dfbb;background:#fffef8;border-radius:25px;box-shadow:0 8px 0 #e7cfa9}.modal .emoji{font-size:54px}.modal h2{color:#e87979;margin:8px 0;font-size:25px}.modal p{line-height:1.65;color:#657b65;font-size:14px}.modal .primary{width:100%;margin-top:10px}.result-score{font-size:38px;color:#4b966c;font-weight:1000}.confetti{position:absolute;z-index:7;top:-15px;width:9px;height:15px;pointer-events:none;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(650px) rotate(800deg);opacity:0}}.footer{text-align:center;margin-top:10px;font-size:10px;color:#8fa18c;font-weight:700}@media(max-height:730px){body{display:block}.game{margin:0 auto;padding:10px 13px 12px}.heading{font-size:23px;margin:0 0 6px}.top{margin-bottom:7px}.stat{padding:4px}.stat strong{font-size:20px}.field{padding:8px}.holes{gap:5px 9px}.hole{aspect-ratio:1.5}.progress{margin:8px 0}.primary{min-height:42px}.hint{margin:6px 0 0}.footer{margin-top:5px}}@media(max-width:350px){.holes{gap:5px}.game{padding:10px}.field{padding:8px}.heading{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-height:600px){.brand,.footer{display:none}.game{padding:6px 10px}.heading{font-size:19px}.top{margin-bottom:5px}.stat strong{font-size:18px}.field{padding:5px}.hole{aspect-ratio:1.8}.progress{margin:5px 0}.hint{margin:4px 0 0}.primary{min-height:38px}}
</style>
</head>
<body>
<main class="game" aria-label="もぐもぐパニック！">
<div class="brand">GAME CRAFT LAB PRESENTS</div>
<h1 class="heading">もぐもぐ<span>パニック！</span></h1>
<div class="top"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat timer"><small>TIME</small><strong id="time">30</strong></div><div class="stat best"><small>BEST</small><strong id="best">0</strong></div></div>
<section class="field" aria-label="9つのモグラの穴"><div class="holes" id="holes"></div></section>
<div class="progress"><div id="bar"></div></div>
<div class="controls"><button id="start" class="primary" type="button">🎮 スタート！</button><button id="sound" class="sound" type="button" aria-label="音をオフにする" aria-pressed="true">🔊</button></div>
<p class="hint" id="hint" aria-live="polite">30秒で何匹たたけるかな？</p>
<div class="footer">© GAME CRAFT LAB｜AIで「作りたい」を「遊べる」に。</div>
<div class="overlay" id="overlay"><div class="modal"><div class="emoji" id="modalEmoji">🐹🌷</div><h2 id="modalTitle">もぐもぐパニック！</h2><p id="modalText">飛び出したモグラをタップ！<br>30秒で高得点を目指そう！</p><div class="result-score" id="result" hidden></div><button class="primary" id="modalStart" type="button">あそぶ！</button></div></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const holes=$('holes'),scoreEl=$('score'),timeEl=$('time'),bestEl=$('best'),bar=$('bar'),hint=$('hint'),startButton=$('start'),soundButton=$('sound'),overlay=$('overlay');
const DURATION=30000;let running=false,score=0,best=0,current=-1,previous=-1,moleTimeout=null,frameId=null,startAt=0,expiryAt=0,moleSerial=0,soundOn=true,audio=null;
try{best=Math.max(0,Number(localStorage.getItem('mogumogu-best-v1'))||0)}catch(e){}bestEl.textContent=best;
const moleMarkup='<span class="pit"></span><span class="mole"><span class="ear left"></span><span class="ear right"></span><span class="body"><span class="face"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="nose"></span><span class="lip"></span></span></span></span><span class="front"></span>';
for(let i=0;i<9;i++){const btn=document.createElement('button');btn.type='button';btn.className='hole';btn.setAttribute('aria-label',`穴${i+1}`);btn.innerHTML=moleMarkup;btn.addEventListener('click',()=>hit(i));holes.append(btn)}
const cells=[...holes.children];
function beep(f=500,d=.08,type='sine'){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(90,f*.65),t+d);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d)}catch(e){}}
function clearMole(){if(current>=0){cells[current].classList.remove('up','hit');cells[current].setAttribute('aria-label',`穴${current+1}`)}current=-1}
function spawn(){if(!running)return;if(performance.now()>=expiryAt){finish();return}clearMole();let next=Math.floor(Math.random()*9);if(next===previous)next=(next+1+Math.floor(Math.random()*8))%9;previous=next;current=next;const serial=++moleSerial;cells[next].classList.add('up');cells[next].setAttribute('aria-label',`穴${next+1}・モグラ出現中`);const elapsed=performance.now()-startAt;const visible=Math.max(430,1050-elapsed/55);moleTimeout=setTimeout(()=>{if(running&&serial===moleSerial){clearMole();moleTimeout=setTimeout(spawn,Math.max(110,230-elapsed/250))}},visible)}
function hit(i){if(running&&performance.now()>=expiryAt){finish();return}if(!running||i!==current)return;const cell=cells[i];if(!cell.classList.contains('up')||cell.classList.contains('hit'))return;cell.classList.add('hit');score+=10;scoreEl.textContent=score;beep(760,.10,'triangle');const pop=document.createElement('span');pop.className='pop';pop.textContent='+10';cell.append(pop);setTimeout(()=>pop.remove(),650);moleSerial++;clearTimeout(moleTimeout);moleTimeout=setTimeout(()=>{clearMole();spawn()},140)}
function tick(now){if(!running)return;const remain=Math.max(0,expiryAt-now);timeEl.textContent=Math.ceil(remain/1000);bar.style.width=(remain/DURATION*100)+'%';if(remain<=0){finish();return}frameId=requestAnimationFrame(tick)}
function confetti(){const colors=['#f28b86','#f7cf65','#8dc8eb','#9edc9d'];const game=document.querySelector('.game');for(let i=0;i<30;i++){const p=document.createElement('span');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=colors[i%4];p.style.animationDelay=Math.random()*.45+'s';game.append(p);setTimeout(()=>p.remove(),2400)}}
function finish(){if(!running)return;running=false;clearTimeout(moleTimeout);cancelAnimationFrame(frameId);moleSerial++;clearMole();timeEl.textContent='0';bar.style.width='0%';startButton.textContent='🎮 もう一度！';let newBest=false;if(score>best){best=score;bestEl.textContent=best;newBest=true;try{localStorage.setItem('mogumogu-best-v1',String(best))}catch(e){}}const rank=score>=300?'🏆 モグラマスター！':score>=180?'🌟 すごい！':score>=80?'🌷 いい感じ！':'🐹 また挑戦！';$('modalEmoji').textContent=newBest?'🎉🏆':'🐹✨';$('modalTitle').textContent=newBest?'ベスト更新！':'ゲーム終了！';$('modalText').textContent=rank;$('result').hidden=false;$('result').textContent=score+'点';$('modalStart').textContent='もう一度あそぶ！';overlay.hidden=false;hint.textContent='おつかれさま！ もう一回チャレンジ！';beep(580,.20,'triangle');if(score>=80||newBest)confetti()}
function begin(){if(running&&!window.confirm('いまのゲームを終了して、最初からやり直す？'))return;clearTimeout(moleTimeout);cancelAnimationFrame(frameId);moleSerial++;clearMole();running=true;score=0;previous=-1;scoreEl.textContent='0';timeEl.textContent='30';bar.style.width='100%';startAt=performance.now();expiryAt=startAt+DURATION;overlay.hidden=true;startButton.textContent='🔄 はじめから';hint.textContent='モグラが出たらすばやくタップ！';beep(650,.11);spawn();frameId=requestAnimationFrame(tick)}
startButton.addEventListener('click',begin);$('modalStart').addEventListener('click',begin);soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'🔊':'🔇';soundButton.setAttribute('aria-label',soundOn?'音をオフにする':'音をオンにする');soundButton.setAttribute('aria-pressed',String(soundOn));if(soundOn)beep(480,.08)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){if(performance.now()>=expiryAt)finish();else {cancelAnimationFrame(frameId);frameId=requestAnimationFrame(tick)}}});
})();
</script>
</body>
</html>
