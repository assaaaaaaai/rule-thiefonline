<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><title>ルール泥棒 ONLINE</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#f8fafc;background:#0b1020}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:22px 16px 60px}.logo{font-size:12px;letter-spacing:.25em;color:#fbbf24;font-weight:900}.hero{font-size:35px;margin:8px 0}.muted{color:#9ca3af;font-size:13px;line-height:1.7}.panel{background:#182235;border:1px solid #334155;border-radius:18px;padding:18px;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{background:#111827;border-radius:12px;padding:12px;font-size:13px}.you{border:1px solid #fbbf24}.chip{background:#334155;border-radius:20px;padding:4px 9px;font-size:11px}.gold{color:#fbbf24}button,input{font:inherit}input{background:#0b1020;border:1px solid #64748b;border-radius:10px;color:white;padding:13px;width:100%;margin:8px 0}button{border:0;border-radius:12px;padding:13px 15px;background:#fbbf24;color:#111827;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#334155;color:#fff}.stack{display:grid;gap:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.num{font-size:30px;min-height:92px;background:#26364d;color:white;border:2px solid #53647c}.num:active{transform:scale(.97)}.law{background:#25334b;color:white;text-align:left;border:1px solid #53647c}.law strong{display:block;margin-bottom:7px}.law span{font-size:12px;font-weight:400;color:#cbd5e1}.note{padding:10px;border-radius:10px;background:#24344a;font-size:13px}.error{background:#7f1d1d;padding:12px;border-radius:10px;margin:10px 0}.winner{background:#2d4b3c;padding:15px;border-radius:12px}.big{font-size:24px;font-weight:900}.hidden{display:none}hr{border:0;border-top:1px solid #334155;margin:16px 0}a{color:#fbbf24}footer{font-size:12px;color:#94a3b8;margin-top:26px}</style></head><body><main><div class="logo">RULE THIEF · ONLINE</div><h1 class="hero">ルール泥棒 <span class="gold">0.3</span></h1><p class="muted">法律を決めろ。数字を賭けて奪え。勝ちを盗め。<br>3〜6人・招待コード式リアルタイム対戦</p><div id="error"></div><div id="root"></div><footer>試作版：通信にはサーバーが必要です。招待コードを知る人だけが参加できます。プレイデータはサーバー再起動で消えます。</footer></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let state=null,session=JSON.parse(localStorage.getItem('rt_session')||'null'),name=localStorage.getItem('rt_name')||'';const root=document.getElementById('root'),err=document.getElementById('error');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(s){err.innerHTML=`<div class="error">${esc(s)}</div>`;setTimeout(()=>err.innerHTML='',5000)}socket.on('errorMessage',notify);socket.on('connect',()=>{if(session)socket.emit('join',{code:session.code,token:session.token,name},x=>save(x));});socket.on('state',s=>{state=s;render()});function save(x){session=x;localStorage.setItem('rt_session',JSON.stringify(x));render()};function emit(event,value){socket.emit(event,value)};function newName(){return document.getElementById('name')?.value.trim()||''};function create(){name=newName();if(!name)return notify('名前を入力してね');localStorage.setItem('rt_name',name);socket.emit('create',{name},save)}function join(){name=newName();if(!name)return notify('名前を入力してね');localStorage.setItem('rt_name',name);socket.emit('join',{name,code:document.getElementById('code').value},save)}function reset(){localStorage.removeItem('rt_session');session=null;state=null;location.reload()};function player(id){return state.players.find(p=>p.id===id)}function playerGrid(){return `<div class="players">${state.players.map(p=>`<div class="player ${p.id===state.me.id?'you':''}"><div class="row"><b>${esc(p.name)}</b><span class="chip">${p.score} pt</span></div><div class="muted">${p.online?'● 接続中':'○ 切断中'} · 残り${p.remaining}枚 ${p.id===state.dealer?'👑':''} ${p.id===state.owner?'⚖️':''}</div></div>`).join('')}</div>`};function hand(action){return `<div class="cards">${state.me.hand.map(n=>`<button class="num" onclick="emit('${action}',${n})">${n}</button>`).join('')}</div>`};function render(){if(!state){root.innerHTML=`<section class="panel"><h2>対戦を始める</h2><label>プレイヤー名</label><input id="name" maxlength="16" value="${esc(name)}" placeholder="ニックネーム"><div class="stack"><button onclick="create()">新しい部屋を作る</button><hr><label>友達の招待コード</label><input id="code" maxlength="6" placeholder="例：A1B2C3" style="text-transform:uppercase"><button class="secondary" onclick="join()">部屋に参加する</button></div></section>`;return}let s=state,me=s.me.id,isDealer=me===s.dealer,ready=(s.players.find(p=>p.id===me)||{});let out=`<section class="panel"><div class="row"><div><span class="muted">招待コード</span><div class="big gold">${esc(s.code)}</div></div><button class="secondary" onclick="navigator.clipboard?.writeText(location.origin+'/?room=${s.code}').then(()=>notify('招待URLをコピーしたよ')).catch(()=>notify('URLをコピーできませんでした'))">招待URLをコピー</button></div><div class="muted">友達にコードを伝えて参加してもらおう</div></section>`;out+=`<section class="panel"><div class="row"><b>${s.phase==='lobby'?'待機ルーム':s.phase==='finished'?'対戦終了':`ROUND ${s.round+1} / ${s.total}`}</b><span class="chip">${s.players.length}人</span></div><hr>${playerGrid()}</section>`;if(s.phase==='lobby'){out+=`<section class="panel"><p>3〜6人が集まったら開始！</p>${s.host===me?`<button ${s.players.length<3?'disabled':''} onclick="emit('start')">対戦スタート</button>`:'<p class="muted">部屋の作成者が開始するまで待ってね。</p>'}<p><button class="secondary" onclick="reset()">部屋を抜ける</button></p></section>`}else if(s.phase==='finished'){let top=Math.max(...s.players.map(p=>p.score));out+=`<section class="panel winner"><h2>🏆 対戦終了！</h2><p>優勝：${s.players.filter(p=>p.score===top).map(p=>esc(p.name)).join('・')}</p><button onclick="reset()">新しい対戦へ</button></section>`}else{out+=`<section class="panel"><div class="muted">制定者：${esc(player(s.dealer)?.name)} / 法律所有者：${esc(player(s.owner)?.name)}</div>${s.law?`<h2 class="gold">⚖️ ${esc(s.law.name)}</h2><p>${esc(s.law.description)}</p>`:''}`;if(s.phase==='law'){out+=isDealer?`<h3>法律を1枚選ぼう</h3><div class="stack">${s.options.map(o=>`<button class="law" onclick="emit('chooseLaw',${o.id})"><strong>${esc(o.name)}</strong><span>${esc(o.description)}</span></button>`).join('')}</div>`:'<p class="note">制定者が法律を選んでいるよ…</p>'}if(s.phase==='auction'){out+=isDealer?'<p class="note">法律強奪の入札待ち。制定者は入札できないよ。</p>':ready.auctionReady?'<p class="note">入札済み。ほかの人を待っているよ。数字はまだ秘密！</p>':`<h3>法律を奪う？</h3><p class="muted">数字を1枚犠牲にして入札。最大の数字を出した人が所有者になる。参加した数字は全員消費する。</p>${s.me.hand.length>=2?hand('auction'):'<p class="note">残り1枚なので入札できないよ。</p>'}<p><button class="secondary" onclick="emit('auction',null)">パスする</button></p>`;out+=`<p class="muted">入札済み：${s.players.filter(p=>p.auctionReady).length}/${s.players.length}</p>`}if(s.phase==='battle'){out+=ready.battleReady?'<p class="note">数字を提出済み。全員の公開を待とう！</p>':`<h3>勝負する数字を選ぼう</h3><p class="muted">数字は同時公開。使用した数字は使い切り！</p>${hand('battle')}`;out+=`<p class="muted">提出済み：${s.players.filter(p=>p.battleReady).length}/${s.players.length}</p>`}if(s.phase==='result'){out+=`<div class="winner"><h2>🎉 ${esc(s.last.winnerName)} の勝ち！</h2><p>+${s.last.points}点 · ${esc(s.last.law)}</p></div><h3>公開された数字</h3><div class="players">${s.last.numbers.map(x=>`<div class="player"><b>${esc(x.name)}</b><div class="big">${x.value}</div></div>`).join('')}</div><p>${isDealer?'<button onclick="emit(\'next\')">次のラウンドへ →</button>':'<span class="note">制定者が次へ進めるのを待ってね。</span>'}</p>`}out+='</section>';out+=`<section class="panel"><b>あなたの使用済みカード</b><p class="muted">${s.me.used.join('・')||'なし'}</p></section>`}root.innerHTML=out};render();if(location.search.includes('room=')){const c=new URLSearchParams(location.search).get('room');setTimeout(()=>{const el=document.getElementById('code');if(el)el.value=c},0)}
</script></body></html>
